<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7x7 メガスロット - ドミノスタイル</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #0b0c10;
      color: #fff;
      margin: 0;
      padding: 20px 0;
      user-select: none;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      text-shadow: 0 0 15px #00f0ff;
      color: #00f0ff;
      font-size: 2rem;
      letter-spacing: 2px;
    }

    /* 点数表示エリア */
    .score-board {
      display: flex;
      gap: 25px;
      margin-bottom: 15px;
      background: #1f2833;
      padding: 10px 30px;
      border-radius: 12px;
      border: 2px solid #66fcf1;
      box-shadow: 0 0 20px rgba(102, 252, 241, 0.3);
    }

    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .score-label {
      font-size: 0.8rem;
      color: #c5c6c7;
    }

    .score-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #45f3ff;
      text-shadow: 0 0 8px #45f3ff;
    }

    /* 7x7 スロット・フレーム */
    .door-frame {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, 52px);
      grid-template-rows: repeat(7, 52px);
      gap: 5px;
      padding: 12px;
      background: linear-gradient(145deg, #1f2833, #0b0c10);
      border: 4px solid #45a29e;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.9);
    }

    /* 1マス（リールの1コマ） */
    .block {
      width: 52px;
      height: 52px;
      background-color: #121212;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      border: 2px solid #2c3540;
      transition: background-color 0.3s, border-color 0.3s, transform 0.15s ease-out;
      position: relative;
    }

    .block.stopped {
      background-color: #1c232d;
      border-color: #45a29e;
    }

    /* ドミノ倒し風着地エフェクト */
    .block.just-stopped {
      transform: scale(1.15) rotate(3deg);
      border-color: #66fcf1;
      background-color: #2b3a4a;
    }

    /* 当たりラインのハイライト */
    .block.win {
      background-color: #ffe600;
      border-color: #ff0055;
      animation: flash 0.4s infinite alternate;
      z-index: 2;
    }

    @keyframes flash {
      from { transform: scale(1); box-shadow: 0 0 5px #ffe600; }
      to { transform: scale(1.1); box-shadow: 0 0 18px #ff0055; }
    }

    /* 回転中のアニメーション */
    @keyframes spin {
      0% { transform: translateY(-6px); }
      50% { transform: translateY(6px); }
      100% { transform: translateY(-6px); }
    }

    .block.spinning {
      animation: spin 0.08s linear infinite;
      opacity: 0.65;
    }

    /* コメント演出オーバーレイ */
    .effect-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 2.5rem;
      font-weight: 900;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s;
      opacity: 0;
      text-shadow: 0 0 20px #000, 0 0 10px #000;
    }

    .effect-overlay.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    /* 操作エリア */
    .controls-container {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #status {
      font-size: 1.1rem;
      font-weight: bold;
      color: #66fcf1;
      height: 1.5rem;
    }

    /* レバー（スイッチ） */
    .switch {
      position: relative;
      display: inline-block;
      width: 80px;
      height: 44px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #e63946;
      transition: .4s;
      border-radius: 44px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 36px;
      width: 36px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #00e676; }
    input:checked + .slider:before { transform: translateX(36px); }
  </style>
</head>
<body>

  <h1>7×7 DOMINO SLOT</h1>

  <!-- スコア表示 -->
  <div class="score-board">
    <div class="score-item">
      <span class="score-label">持ち点 (BET: 10)</span>
      <span class="score-value" id="credit">1000</span>
    </div>
    <div class="score-item">
      <span class="score-label">前回の獲得点</span>
      <span class="score-value" id="lastWin">0</span>
    </div>
  </div>

  <!-- 7x7 スロット盤面 -->
  <div class="door-frame" id="doorFrame">
    <div class="effect-overlay" id="effectOverlay"></div>
  </div>

  <!-- レバー操作エリア -->
  <div class="controls-container">
    <div id="status">レバーを引いてスタート！</div>
    <div style="display: flex; align-items: center; gap: 15px; font-size: 1.2rem; font-weight: bold;">
      <span>STOP</span>
      <label class="switch">
        <input type="checkbox" id="leverToggle">
        <span class="slider"></span>
      </label>
      <span>SPIN</span>
    </div>
  </div>

  <script>
    const doorFrame = document.getElementById('doorFrame');
    const leverToggle = document.getElementById('leverToggle');
    const statusText = document.getElementById('status');
    const creditEl = document.getElementById('credit');
    const lastWinEl = document.getElementById('lastWin');
    const effectOverlay = document.getElementById('effectOverlay');

    // ★ 速度パラメータ設定 (ここでお好みのスピードに調整できます)
    const TIME_PER_BLOCK = 220; // 1マス（コマ）が止まる間隔 (220ms = ゆっくりめ)
    const TIME_PER_ROW = 650;   // 列（行）が変わる時のウェイト時間 (650ms = しっかり空ける)

    // ゲーム変数
    let credit = 1000;
    const BET_COST = 10;
    let isSpinning = false;
    let spinIntervals = [];

    // 絵柄データ (アイコン / 点数倍率)
    const symbols = [
      { char: '7️⃣', score: 150 },
      { char: '💎', score: 80 },
      { char: '⭐', score: 50 },
      { char: '🔔', score: 30 },
      { char: '🍉', score: 20 },
      { char: '🍇', score: 15 },
      { char: '🍋', score: 10 },
      { char: '🍒', score: 5 }
    ];

    // Web Audio API による音効
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const now = audioCtx.currentTime;
      if (type === 'spin') {
        const osc = audioCtx.createOscillator();
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
        osc.connect(audioCtx.destination);
        osc.start(); osc.stop(now + 0.1);
      } else if (type === 'stop') {
        const osc = audioCtx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
        osc.connect(audioCtx.destination);
        osc.start(); osc.stop(now + 0.08);
      } else if (type === 'small') {
        [261, 329, 392].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          osc.connect(audioCtx.destination);
          osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.1);
        });
      } else if (type === 'big') {
        const notes = [261, 329, 392, 523, 659, 783];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          osc.type = 'square';
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.1, now + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.25);
          osc.frequency.setValueAtTime(freq, now + i * 0.1);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.3);
        });
      } else if (type === 'jackpot') {
        const notes = [523, 523, 523, 523, 659, 783, 1046];
        const times = [0, 0.12, 0.24, 0.36, 0.5, 0.65, 0.8];
        const durations = [0.1, 0.1, 0.1, 0.1, 0.12, 0.12, 0.6];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          osc.type = 'triangle';
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.2, now + times[i]);
          gain.gain.exponentialRampToValueAtTime(0.01, now + times[i] + durations[i]);
          osc.frequency.setValueAtTime(freq, now + times[i]);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + times[i]); osc.stop(now + times[i] + durations[i]);
        });
      }
    }

    // 7x7盤面の生成 (計49マス)
    const blocks = [];
    for (let i = 0; i < 49; i++) {
      const block = document.createElement('div');
      block.classList.add('block', 'stopped');
      block.textContent = symbols[Math.floor(Math.random() * symbols.length)].char;
      doorFrame.appendChild(block);
      blocks.push(block);
    }

    // 単一マスの回転開始
    function startBlockSpin(index) {
      if (spinIntervals[index]) return;
      blocks[index].classList.remove('stopped', 'win', 'just-stopped');
      blocks[index].classList.add('spinning');
      spinIntervals[index] = setInterval(() => {
        blocks[index].textContent = symbols[Math.floor(Math.random() * symbols.length)].char;
      }, 50);
    }

    // 単一マスの停止（ドミノ風ポップアップ演出）
    function stopBlockSpin(index, targetChar = null) {
      if (!spinIntervals[index]) return;
      clearInterval(spinIntervals[index]);
      spinIntervals[index] = null;
      blocks[index].classList.remove('spinning');
      blocks[index].classList.add('stopped', 'just-stopped');
      
      if (targetChar) {
        blocks[index].textContent = targetChar;
      }
      
      playSound('stop');

      // 少し時間が経ったらポップアップアニメーション効果を戻す
      setTimeout(() => {
        blocks[index].classList.remove('just-stopped');
      }, 200);
    }

    // スタート
    function startAllSpins() {
      if (isSpinning) return;

      if (credit < BET_COST) {
        statusText.textContent = "ポイント不足です！";
        leverToggle.checked = false;
        return;
      }

      credit -= BET_COST;
      creditEl.textContent = credit;
      lastWinEl.textContent = 0;
      hideEffect();

      isSpinning = true;
      statusText.textContent = "スロット回転中... レバーを戻してSTOP";
      playSound('spin');

      for (let i = 0; i < 49; i++) {
        startBlockSpin(i);
      }
    }

    // ★ 7x7内部抽選：当たり確率 25% (3〜5回に1回)
    function generateTargetGrid() {
      const WIN_RATE = 0.25; 
      const isWin = Math.random() < WIN_RATE;

      const grid = [];
      for (let r = 0; r < 7; r++) {
        grid[r] = [];
        for (let c = 0; c < 7; c++) {
          grid[r][c] = symbols[Math.floor(Math.random() * symbols.length)].char;
        }
      }

      if (isWin) {
        const winSymbol = symbols[Math.floor(Math.random() * symbols.length)].char;
        const winType = Math.floor(Math.random() * 3);

        if (winType === 0) {
          // 横ライン当たり
          const row = Math.floor(Math.random() * 7);
          for (let c = 0; c < 7; c++) grid[row][c] = winSymbol;
        } else if (winType === 1) {
          // 縦ライン当たり
          const col = Math.floor(Math.random() * 7);
          for (let r = 0; r < 7; r++) grid[r][col] = winSymbol;
        } else {
          // 斜めライン当たり
          if (Math.random() < 0.5) {
            for (let i = 0; i < 7; i++) grid[i][i] = winSymbol;
          } else {
            for (let i = 0; i < 7; i++) grid[i][6 - i] = winSymbol;
          }
        }
      }

      return grid;
    }

    // ★ 7x7 ドミノ倒し風順次停止処理
    async function stopSpinsSequential() {
      if (!isSpinning) return;
      isSpinning = false;
      leverToggle.disabled = true;
      statusText.textContent = "ゆっくりドミノ停止中...";

      const targetGrid = generateTargetGrid();

      // 下の行(行6)から上の行(行0)へ、各行で左(列0)から右(列6)へ1マスずつゆっくり停止
      for (let row = 6; row >= 0; row--) {
        for (let col = 0; col < 7; col++) {
          const idx = row * 7 + col;
          stopBlockSpin(idx, targetGrid[row][col]);
          
          // ★ マスごとのゆっくり停止間隔 (220ms)
          await new Promise(r => setTimeout(r, TIME_PER_BLOCK));
        }
        // ★ 列（行）が変わる時のウェイト時間 (650ms: 間隔を少し空ける)
        await new Promise(r => setTimeout(r, TIME_PER_ROW));
      }

      // 判定処理へ
      checkWins();
      leverToggle.disabled = false;
    }

    // 7x7 役（揃い）判定処理
    function checkWins() {
      const grid = [];
      for (let r = 0; r < 7; r++) {
        grid[r] = [];
        for (let c = 0; c < 7; c++) {
          grid[r][c] = blocks[r * 7 + c].textContent;
        }
      }

      let totalWin = 0;
      let winningIndices = new Set();
      let matchLinesCount = 0;

      // 1. 横ライン判定 (7連)
      for (let r = 0; r < 7; r++) {
        const first = grid[r][0];
        if (grid[r].every(char => char === first)) {
          matchLinesCount++;
          const symData = symbols.find(s => s.char === first);
          totalWin += symData.score * 15;
          for (let c = 0; c < 7; c++) winningIndices.add(r * 7 + c);
        }
      }

      // 2. 縦ライン判定 (7連)
      for (let c = 0; c < 7; c++) {
        const first = grid[0][c];
        let match = true;
        for (let r = 0; r < 7; r++) {
          if (grid[r][c] !== first) { match = false; break; }
        }
        if (match) {
          matchLinesCount++;
          const symData = symbols.find(s => s.char === first);
          totalWin += symData.score * 15;
          for (let r = 0; r < 7; r++) winningIndices.add(r * 7 + c);
        }
      }

      // 3. 斜めライン判定 (7連)
      let diag1Match = true;
      const diag1First = grid[0][0];
      for (let i = 0; i < 7; i++) {
        if (grid[i][i] !== diag1First) diag1Match = false;
      }
      if (diag1Match) {
        matchLinesCount++;
        const symData = symbols.find(s => s.char === diag1First);
        totalWin += symData.score * 20;
        for (let i = 0; i < 7; i++) winningIndices.add(i * 7 + i);
      }

      let diag2Match = true;
      const diag2First = grid[0][6];
      for (let i = 0; i < 7; i++) {
        if (grid[i][6 - i] !== diag2First) diag2Match = false;
      }
      if (diag2Match) {
        matchLinesCount++;
        const symData = symbols.find(s => s.char === diag2First);
        totalWin += symData.score * 20;
        for (let i = 0; i < 7; i++) winningIndices.add(i * 7 + (6 - i));
      }

      // 当たったマスをハイライト
      winningIndices.forEach(idx => blocks[idx].classList.add('win'));

      // スコアの加算と演出
      if (totalWin > 0) {
        credit += totalWin;
        creditEl.textContent = credit;
        lastWinEl.textContent = totalWin;

        if (totalWin >= 800 || matchLinesCount >= 2) {
          showEffect("🎉 MEGA JACKPOT!! 🎉<br>+ " + totalWin + "pt", "#ff007f");
          playSound('jackpot');
          statusText.textContent = "7×7 超大当りおめでとう！！";
        } else if (totalWin >= 200) {
          showEffect("🔥 BIG WIN!! 🔥<br>+ " + totalWin + "pt", "#ff9800");
          playSound('big');
          statusText.textContent = "大当り！";
        } else {
          showEffect("WIN! + " + totalWin + "pt", "#00e676");
          playSound('small');
          statusText.textContent = "小当り！";
        }
      } else {
        statusText.textContent = "残念... 再びレバーを引こう！";
      }
    }

    // 演出表示
    function showEffect(text, color) {
      effectOverlay.innerHTML = text;
      effectOverlay.style.color = color;
      effectOverlay.classList.add('show');
    }

    function hideEffect() {
      effectOverlay.classList.remove('show');
    }

    // レバー操作イベント
    leverToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        startAllSpins();
      } else {
        stopSpinsSequential();
      }
    });
  </script>

</body>
</html>
